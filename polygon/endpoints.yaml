# The hand-written list of the reference platform's endpoints.
#
# The source for `barbican run --endpoints`. This is a human's declaration, not a
# dump from the platform's code: a specification generated from the same
# implementation would turn the check into a comparison of the implementation with
# itself (ADR-0006).
endpoints:
  # A public endpoint. A control: its status is not changed by a single defect flag.
  - id: health
    method: GET
    path: /v1/health

  # A list with no parameters. A canary: it answers 200 only with a working token.
  - id: orders.list
    method: GET
    path: /v1/orders

  # An endpoint with a path parameter — BOLA and the cross-tenant leak live on it.
  - id: orders.read
    method: GET
    path: /v1/orders/{orderId}

  # Tenant-level summary settlement statements. The only place where the relation
  # `ancestor-tenant` arises: a statement belongs to the tenant as a whole, so for an
  # account sitting lower it lies **higher** up the tree. The parameter is named
  # differently from the orders' one, and that is not cosmetic: a resource is bound
  # to an endpoint by matching parameter names, so orders are not substituted in here,
  # nor a statement into the orders.
  #
  # There are two statements — the brand's and the holding's — and both are on one
  # endpoint deliberately: that way "disclosure one level up" and "disclosure along
  # the whole chain of ancestors" differ only by the depth of the tree, not by the
  # address.
  - id: statements.read
    method: GET
    path: /v1/statements/{statementId}

  # The affiliate's own statistics. The canary of its account: the only endpoint
  # where its token must give 200. Without it the canary would have to be `health`,
  # which answers 200 without a token at all — that is, tests nothing.
  - id: affiliate.stats
    method: GET
    path: /v1/affiliate/stats

  # The admin endpoint: the defect of the switched-off role check is visible on it.
  - id: admin.accounts
    method: GET
    path: /v1/admin/accounts
