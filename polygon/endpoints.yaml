# Ручной список эндпоинтов референс-платформы.
#
# Источник для `barbican run --endpoints`. Это объявление человека, а не выгрузка
# из кода платформы: спецификация, порождённая из той же реализации, превратила бы
# проверку в сверку реализации с самой собой (ADR-0006).
endpoints:
  # Публичная ручка. Контроль: её статус не меняет ни один флаг дефекта.
  - id: health
    method: GET
    path: /v1/health

  # Список без параметров. Канарейка: отвечает 200 только с рабочим токеном.
  - id: orders.list
    method: GET
    path: /v1/orders

  # Ручка с параметром пути — на ней живут BOLA и межтенантная утечка.
  - id: orders.read
    method: GET
    path: /v1/orders/{orderId}

  # Сводные расчётные документы уровня тенанта. Единственное место, где возникает
  # отношение `ancestor-tenant`: документ принадлежит тенанту целиком, поэтому для
  # аккаунта, сидящего ниже, он лежит **выше** по дереву. Параметр называется иначе,
  # чем у заказов, и это не косметика: объект привязывается к ручке по совпадению
  # имён параметров, так что заказы сюда не подставляются, а документ — в заказы.
  #
  # Документов два — брендовый и холдинговый, — и оба на одной ручке намеренно:
  # так «раскрытие на один уровень вверх» и «раскрытие на всю цепочку предков»
  # различаются только глубиной дерева, а не адресом.
  - id: statements.read
    method: GET
    path: /v1/statements/{statementId}

  # Собственная статистика аффилиата. Канарейка его аккаунта: единственная ручка,
  # где его токен обязан дать 200. Без неё канарейкой пришлось бы делать `health`,
  # который отвечает 200 и вовсе без токена, — то есть не проверяет ничего.
  - id: affiliate.stats
    method: GET
    path: /v1/affiliate/stats

  # Админская ручка: на ней виден дефект отключённой проверки роли.
  - id: admin.accounts
    method: GET
    path: /v1/admin/accounts
