# Ручной список эндпоинтов референс-платформы.
#
# Источник для `barbican run --endpoints`. Это объявление человека, а не выгрузка
# из кода платформы: спецификация, порождённая из той же реализации, превратила бы
# проверку в сверку реализации с самой собой (ADR-0006).
endpoints:
  # Публичная ручка. Контроль: её статус не меняет ни один флаг дефекта.
  - id: health
    method: GET
    path: /v1/health

  # Список без параметров. Канарейка: отвечает 200 только с рабочим токеном.
  - id: orders.list
    method: GET
    path: /v1/orders

  # Единственная ручка с параметром пути — на ней живут BOLA и межтенантная утечка.
  - id: orders.read
    method: GET
    path: /v1/orders/{orderId}

  # Админская ручка: на ней виден дефект отключённой проверки роли.
  - id: admin.accounts
    method: GET
    path: /v1/admin/accounts
