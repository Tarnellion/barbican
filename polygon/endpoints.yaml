# Ручной список эндпоинтов референс-платформы.
#
# Источник для `barbican run --endpoints`. Это объявление человека, а не выгрузка
# из кода платформы: спецификация, порождённая из той же реализации, превратила бы
# проверку в сверку реализации с самой собой (ADR-0006).
endpoints:
  # Публичная ручка. Контроль: её статус не меняет ни один флаг дефекта.
  - id: health
    method: GET
    path: /v1/health

  # Список без параметров. Канарейка: отвечает 200 только с рабочим токеном.
  - id: orders.list
    method: GET
    path: /v1/orders

  # Ручка с параметром пути — на ней живут BOLA и межтенантная утечка.
  - id: orders.read
    method: GET
    path: /v1/orders/{orderId}

  # Сводный документ уровня холдинга. Единственное место, где возникает отношение
  # `ancestor-tenant`: объект принадлежит холдингу целиком, поэтому для брендового
  # аккаунта он лежит **выше** по дереву. Параметр называется иначе, чем у заказов,
  # и это не косметика: объект привязывается к ручке по совпадению имён параметров,
  # так что заказы сюда не подставляются, а документ — не подставляется в заказы.
  - id: statements.read
    method: GET
    path: /v1/statements/{statementId}

  # Админская ручка: на ней виден дефект отключённой проверки роли.
  - id: admin.accounts
    method: GET
    path: /v1/admin/accounts
