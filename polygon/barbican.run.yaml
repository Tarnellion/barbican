# Конфигурация прогона против референс-платформы (формат — ADR-0008).
#
# Токенов здесь нет и быть не может: аккаунт называет имя переменной окружения.
# Значения выставляет `verify.mjs` (случайные на каждый прогон) либо оператор
# вручную — см. README.md.

target:
  # Порт обязан совпадать с POLYGON_PORT платформы. verify.mjs сверяет это сам:
  # разошедшись, они дали бы сплошные отказы и отчёт «всё чисто».
  baseUrl: http://127.0.0.1:8787
  allowedHosts: [127.0.0.1]

# Дерево тенантов в развёрнутой форме (ADR-0013): два холдинга, под каждым бренд.
#
# Родство объявлено явно, отдельным полем. Форма `holding-1/tenant-a` была бы
# короче, но превратила бы идентификатор в разбираемую структуру: опечатка
# в префиксе молча сделала бы бренд отдельным корнем, `descendant-tenant` стал бы
# `foreign-tenant`, правило ниже перестало бы применяться — и находка исчезла бы.
#
# Перечень заодно включает строгую сверку: тенант аккаунта или объекта, которого
# здесь нет, — ошибка на старте, а не тихое изменение смысла.
tenants:
  - { id: holding-1 }
  - { id: holding-2 }
  - { id: tenant-a, parent: holding-1 }
  - { id: tenant-b, parent: holding-2 }
  # Служебный тенант анонима. Корень без родни: любой объект для него
  # foreign-tenant, как и было до появления дерева.
  - { id: none }

accounts:
  # Тенант A: владелец заказа A-1001 и другой пользователь того же тенанта.
  # Второй нужен, чтобы отличить BOLA внутри тенанта от межтенантной утечки.
  - id: alice-a
    role: user
    tenant: tenant-a
    tokenEnv: POLYGON_TOKEN_ALICE_A
    canary: orders.list
  - id: bob-a
    role: user
    tenant: tenant-a
    tokenEnv: POLYGON_TOKEN_BOB_A
    canary: orders.list

  # Тенант B — зеркально.
  - id: carol-b
    role: user
    tenant: tenant-b
    tokenEnv: POLYGON_TOKEN_CAROL_B
    canary: orders.list
  - id: dave-b
    role: user
    tenant: tenant-b
    tokenEnv: POLYGON_TOKEN_DAVE_B
    canary: orders.list

  # Администратор тенанта A: ему положены все объекты своего тенанта
  # и не положен ни один чужой.
  - id: admin-a
    role: admin
    tenant: tenant-a
    tokenEnv: POLYGON_TOKEN_ADMIN_A
    canary: orders.list

  # Аккаунт уровня холдинга. Сидит на самом холдинге, а не на одном из брендов:
  # приписав его к бренду, мы получили бы «свой бренд = чужой тенант» — тот самый
  # обходной путь, из-за которого межхолдинговая утечка проходила незамеченной
  # (ADR-0013). Второй холдинг аккаунта не имеет намеренно: он нужен как чужая
  # ветвь дерева, а не как ещё один набор ячеек.
  - id: helen-h1
    role: holding
    tenant: holding-1
    tokenEnv: POLYGON_TOKEN_HELEN_H1
    canary: orders.list

  # Аноним: без токена. Проверяет утверждение «эта ручка не публична».
  # Тенант `none` — служебный: любой объект для него foreign-tenant.
  - id: anonymous
    role: anonymous
    tenant: none

# Объекты обращения и их владельцы (ADR-0010). Идентификаторы объявляются,
# а не выуживаются из ответов, — тела мы не читаем.
resources:
  - id: order-a-1001
    tenant: tenant-a
    owner: alice-a
    params: { orderId: "A-1001" }
  - id: order-a-1002
    tenant: tenant-a
    owner: bob-a
    params: { orderId: "A-1002" }
  - id: order-b-2001
    tenant: tenant-b
    owner: carol-b
    params: { orderId: "B-2001" }
  - id: order-b-2002
    tenant: tenant-b
    owner: dave-b
    params: { orderId: "B-2002" }

policy:
  # Всё, что не объявлено, считается запрещённым.
  fallback: denied
  rules:
    # Проверка живости открыта всем, включая аноним.
    - roles: "*"
      endpoints: [health]
      outcome: allowed

    # Свой список заказов положен любому аутентифицированному.
    # Аноним сюда не попадает: у роли `anonymous` доступа нет.
    - roles: [user, admin, holding]
      endpoints: [orders.list]
      outcome: allowed

    # Админская ручка — только администратору.
    - roles: [admin]
      endpoints: [admin.accounts]
      outcome: allowed

    # Пользователю положен только свой заказ. Чужой заказ своего тенанта
    # (same-tenant) и любой чужой тенант остаются под fallback: denied.
    - roles: [user]
      endpoints: [orders.read]
      scope: own
      outcome: allowed

    # Администратору положены все объекты его тенанта. Своих объектов
    # у него нет, поэтому правило на `own` не нужно.
    - roles: [admin]
      endpoints: [orders.read]
      scope: same-tenant
      outcome: allowed

    # Холдингу положены объекты его брендов — и только они. Правило выражает
    # намерение буквально: «всё, что ниже меня по дереву».
    #
    # Бренд чужого холдинга остаётся под fallback: denied, потому что он
    # foreign-tenant, а не descendant-tenant. До ADR-0013 этих двух отношений
    # не различали, и оба способа записать правило были неверны: `foreign-tenant`
    # открывал доступ к чужому холдингу, отсутствие правила — закрывало свой бренд.
    - roles: [holding]
      endpoints: [orders.read]
      scope: descendant-tenant
      outcome: allowed

# Ответ списка обязан различаться между тенантами: у каждого свои заказы.
# Совпадение означает отсутствующий фильтр — дефект, не меняющий статуса
# и потому невидимый без чтения тела. Тело читается только здесь. См. ADR-0011.
bodySignals:
  tenantScoped: [orders.list]
  # Находки не порождает: нужен человеку, разбирающему находку дайджеста.
  # «Ответы совпали» — тревога, а триаж начинается с «сколько записей кто увидел».
  signals:
    - { name: orderCount, kind: count, path: orders, endpoints: [orders.list] }
