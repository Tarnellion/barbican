# Конфигурация прогона против референс-платформы (формат — ADR-0008).
#
# Токенов здесь нет и быть не может: аккаунт называет имя переменной окружения.
# Значения выставляет `verify.mjs` (случайные на каждый прогон) либо оператор
# вручную — см. README.md.

target:
  # Порт обязан совпадать с POLYGON_PORT платформы. verify.mjs сверяет это сам:
  # разошедшись, они дали бы сплошные отказы и отчёт «всё чисто».
  baseUrl: http://127.0.0.1:8787
  allowedHosts: [127.0.0.1]

# Дерево тенантов в развёрнутой форме (ADR-0013): два холдинга, под каждым бренд,
# под одним из брендов — аффилиат.
#
# Родство объявлено явно, отдельным полем. Форма `holding-1/tenant-a` была бы
# короче, но превратила бы идентификатор в разбираемую структуру: опечатка
# в префиксе молча сделала бы бренд отдельным корнем, `descendant-tenant` стал бы
# `foreign-tenant`, правило ниже перестало бы применяться — и находка исчезла бы.
#
# Перечень заодно включает строгую сверку: тенант аккаунта или объекта, которого
# здесь нет, — ошибка на старте, а не тихое изменение смысла.
tenants:
  - { id: holding-1 }
  - { id: holding-2 }
  - { id: tenant-a, parent: holding-1 }
  - { id: tenant-b, parent: holding-2 }
  # Третий уровень. Единственное место в дереве, где у аккаунта **два** предка:
  # tenant-a через шаг и holding-1 через два. Пока такого места не было, «прямой
  # родитель» и «любой предок» совпадали, и реализация, поднимающаяся на один
  # уровень вместо всей цепочки, была неотличима от правильной.
  - { id: affiliate-a1, parent: tenant-a }

accounts:
  # Тенант A: владелец заказа A-1001 и другой пользователь того же тенанта.
  # Второй нужен, чтобы отличить BOLA внутри тенанта от межтенантной утечки.
  - id: alice-a
    role: user
    tenant: tenant-a
    tokenEnv: POLYGON_TOKEN_ALICE_A
    canary: orders.list
  - id: bob-a
    role: user
    tenant: tenant-a
    tokenEnv: POLYGON_TOKEN_BOB_A
    canary: orders.list

  # Тенант B — зеркально.
  - id: carol-b
    role: user
    tenant: tenant-b
    tokenEnv: POLYGON_TOKEN_CAROL_B
    canary: orders.list
  - id: dave-b
    role: user
    tenant: tenant-b
    tokenEnv: POLYGON_TOKEN_DAVE_B
    canary: orders.list

  # Администратор тенанта A: ему положены все объекты своего тенанта
  # и не положен ни один чужой.
  - id: admin-a
    role: admin
    tenant: tenant-a
    tokenEnv: POLYGON_TOKEN_ADMIN_A
    canary: orders.list

  # Аккаунт уровня холдинга. Сидит на самом холдинге, а не на одном из брендов:
  # приписав его к бренду, мы получили бы «свой бренд = чужой тенант» — тот самый
  # обходной путь, из-за которого межхолдинговая утечка проходила незамеченной
  # (ADR-0013). Второй холдинг аккаунта не имеет намеренно: он нужен как чужая
  # ветвь дерева, а не как ещё один набор ячеек.
  - id: helen-h1
    role: holding
    tenant: holding-1
    tokenEnv: POLYGON_TOKEN_HELEN_H1
    canary: orders.list

  # Аффилиат под брендом — третий уровень дерева. Ему положена только своя
  # статистика; ни список заказов бренда, ни расчётные документы — ни бренда,
  # ни холдинга — ему не положены.
  #
  # Канарейка у него своя, а не `orders.list`: этот список ему объявлен закрытым,
  # и канарейка на нём остановила бы прогон ложной тревогой «токен не работает».
  - id: ivan-af1
    role: affiliate
    tenant: affiliate-a1
    tokenEnv: POLYGON_TOKEN_IVAN_AF1
    canary: affiliate.stats

  # Аноним: без токена. Проверяет утверждение «эта ручка не публична».
  #
  # Поля `tenant` у него нет — и это утверждение, а не пропуск: аккаунт объявлен
  # **вне тенантов**. Служебное имя вроде `none` стояло бы в одном пространстве
  # значений с настоящими, и платформа с тенантом, который так и называется,
  # сделала бы аноним его соседом по тенанту — молча. Отношение к любому объекту
  # у аккаунта вне тенантов одно, `foreign-tenant`: родства нет и быть не может.
  - id: anonymous
    role: anonymous

# Объекты обращения и их владельцы (ADR-0010). Идентификаторы объявляются,
# а не выуживаются из ответов, — тела мы не читаем.
resources:
  - id: order-a-1001
    tenant: tenant-a
    owner: alice-a
    params: { orderId: "A-1001" }
  - id: order-a-1002
    tenant: tenant-a
    owner: bob-a
    params: { orderId: "A-1002" }
  - id: order-b-2001
    tenant: tenant-b
    owner: carol-b
    params: { orderId: "B-2001" }
  - id: order-b-2002
    tenant: tenant-b
    owner: dave-b
    params: { orderId: "B-2002" }

  # Сводный документ холдинга. Поля `owner` нет намеренно: документ принадлежит
  # тенанту целиком, владельца-пользователя у него не существует. Из этого прямо
  # следуют отношения, ради которых объект и заведён: для `helen-h1` он
  # `same-tenant` (а не `own` — своим он ни для кого не является), а для любого
  # брендового аккаунта холдинга — `ancestor-tenant`, единственное отношение
  # ADR-0013, которое до сих пор не проверялось ни одной ячейкой.
  - id: statement-h1-0001
    tenant: holding-1
    params: { statementId: "H1-0001" }

  # Расчётный документ бренда: суммы по игрокам `tenant-a`. Владельца-пользователя
  # у него тоже нет — он принадлежит бренду целиком.
  #
  # Он и делает дерево проверяемым на глубину. Для брендовых аккаунтов это
  # `same-tenant` (положен), для холдинга — `descendant-tenant` (положен: сводный
  # взгляд лицензиата), для чужого бренда — `foreign-tenant` (не положен никогда),
  # а для аффилиата — `ancestor-tenant` **через один шаг**, тогда как документ
  # холдинга для него — `ancestor-tenant` через два. Ровно на этой паре ячеек
  # и расходятся два дефекта раскрытия вверх.
  - id: statement-a-0001
    tenant: tenant-a
    params: { statementId: "A-0001" }

policy:
  # Всё, что не объявлено, считается запрещённым.
  fallback: denied
  rules:
    # Проверка живости открыта всем, включая аноним.
    - roles: "*"
      endpoints: [health]
      outcome: allowed

    # Свой список заказов положен любому аутентифицированному.
    # Аноним сюда не попадает: у роли `anonymous` доступа нет.
    - roles: [user, admin, holding]
      endpoints: [orders.list]
      outcome: allowed

    # Админская ручка — только администратору.
    - roles: [admin]
      # Шаблон вместо идентификатора: на платформе в сотню ручек перечисление
      # расходится с реальностью при первой же новой, причём молча. Шаблон,
      # не совпавший ни с чем, отвергается на старте.
      endpoints: [{ method: GET, path: /v1/admin/** }]
      outcome: allowed

    # Своя статистика — только аффилиату. Всем прочим ручка не положена
    # и остаётся под fallback: denied, как и админская.
    - roles: [affiliate]
      endpoints: [affiliate.stats]
      outcome: allowed

    # Аффилиату не положен брендовый контур заказов — ни списком, ни поштучно.
    # Правило ничего не меняет против fallback: denied и написано ровно затем,
    # зачем ниже написан запрет на `ancestor-tenant`, — чтобы утверждение
    # существовало и проверялось, а не подразумевалось.
    - roles: [affiliate]
      endpoints: [orders.list, orders.read]
      outcome: denied

    # Пользователю положен только свой заказ. Чужой заказ своего тенанта
    # (same-tenant) и любой чужой тенант остаются под fallback: denied.
    - roles: [user]
      endpoints: [orders.read]
      scope: own
      outcome: allowed

    # Администратору положены все объекты его тенанта. Своих объектов
    # у него нет, поэтому правило на `own` не нужно.
    - roles: [admin]
      endpoints: [orders.read]
      scope: same-tenant
      outcome: allowed

    # Холдингу положены объекты его брендов — и только они. Правило выражает
    # намерение буквально: «всё, что ниже меня по дереву».
    #
    # Бренд чужого холдинга остаётся под fallback: denied, потому что он
    # foreign-tenant, а не descendant-tenant. До ADR-0013 этих двух отношений
    # не различали, и оба способа записать правило были неверны: `foreign-tenant`
    # открывал доступ к чужому холдингу, отсутствие правила — закрывало свой бренд.
    - roles: [holding]
      endpoints: [orders.read]
      scope: descendant-tenant
      outcome: allowed

    # Расчётный документ своего уровня положен аккаунту этого уровня. Отношение
    # здесь `same-tenant`, а не `own`: владельца-пользователя у документа нет,
    # а значит своим он не является ни для кого. Правило про `own` было бы мёртвым.
    #
    # Роли `affiliate` в списке нет намеренно: документа уровня `affiliate-a1`
    # на платформе не существует, и правило для него не сработало бы ни разу.
    # Мёртвое правило хуже отсутствующего — оно выглядит проверенным утверждением.
    - roles: [user, admin, holding]
      endpoints: [statements.read]
      scope: same-tenant
      outcome: allowed

    # Вниз по дереву документ виден: холдингу положен расчётный документ его
    # бренда. Это тот самый сквозной взгляд лицензиата, ради которого ADR-0013
    # и различает `descendant-tenant` с `ancestor-tenant`, — направления
    # противоположны, и правило вниз не должно открывать дорогу вверх.
    - roles: [holding]
      endpoints: [statements.read]
      scope: descendant-tenant
      outcome: allowed

    # Уровень выше своего не положен никому: ни бренду — уровень его холдинга,
    # ни аффилиату — уровень его бренда и тем более холдинга. Правило ничего
    # не меняет по сравнению с `fallback: denied` — и написано именно поэтому.
    #
    # Умолчание и объявленный запрет снаружи неразличимы, а означают разное:
    # первое — «про этот случай не думали», второе — «подумали и запретили».
    # Полигон существует, чтобы проверять утверждения; утверждение, которого
    # никто не записал, проверить нельзя. Ровно та же причина, по которой
    # непокрытое отношение вынесено отдельным пунктом в README, а не оставлено
    # умолчанием.
    #
    # Обе ячейки аффилиата — и через шаг, и через два — попадают под это одно
    # правило: `ancestor-tenant` не считает шаги. Различие между «поднялись на
    # уровень» и «поднялись по цепочке» живёт не в политике, а в платформе,
    # и потому оно и есть предмет проверки.
    #
    # Порядок значим: выигрывает последнее подходящее правило. Запрет стоит
    # после разрешающих и потому перекрывает их, а не наоборот.
    - roles: [user, admin, affiliate]
      endpoints: [statements.read]
      scope: ancestor-tenant
      outcome: denied

# Ответ списка обязан различаться между тенантами: у каждого свои заказы.
# Совпадение означает отсутствующий фильтр — дефект, не меняющий статуса
# и потому невидимый без чтения тела. Тело читается только здесь. См. ADR-0011.
#
# Ключ называет объявляемое ожидание, а не свойство ручки: `orders.read` тоже
# тенант-скоупный по смыслу, но сравнивать по телу там нечего — там дефект
# виден по статусу, и объявления нет.
bodySignals:
  responseMustDifferByTenant: [orders.list]
  # Находки не порождает: нужен человеку, разбирающему находку дайджеста.
  # «Ответы совпали» — тревога, а триаж начинается с «сколько записей кто увидел».
  signals:
    - { name: orderCount, kind: count, path: orders, endpoints: [orders.list] }
