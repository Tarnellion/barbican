# Git hooks. Installed with: pnpm run hooks:install
#
# gitleaks is a system binary (brew install gitleaks), deliberately not an npm
# dependency: npm wrappers download the binary in postinstall, and that is exactly
# the vector allowBuilds in pnpm-workspace.yaml guards against. If gitleaks is not
# installed the hook fails — that is deliberate: a secret scan must never be
# skipped silently.

pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: "*.{ts,js,json,jsonc}"
      run: pnpm exec biome check --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}

    - name: gitleaks
      run: gitleaks git --staged --redact --no-banner

pre-push:
  parallel: false
  jobs:
    - name: typecheck
      run: pnpm run typecheck

    - name: test
      run: pnpm run test
