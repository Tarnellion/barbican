# Git hooks. Installed with: pnpm run hooks:install
#
# gitleaks is a system binary (brew install gitleaks), deliberately not an npm
# dependency: npm wrappers download the binary in postinstall, and that is exactly
# the vector allowBuilds in pnpm-workspace.yaml guards against. If gitleaks is not
# installed the hook fails — that is deliberate: a secret scan must never be
# skipped silently.

pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: "*.{ts,js,json,jsonc}"
      run: pnpm exec biome check --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}

    - name: gitleaks
      run: gitleaks git --staged --redact --no-banner

    # Says nothing when the local gitleaks is the one ci.yml pins, which is the
    # usual case. It does not block: CI scans the full history whichever way the
    # two differ, and a hook that refuses for a reason the committer cannot fix
    # in the moment teaches people --no-verify, which turns off the scan above.
    - name: gitleaks-pin
      run: node tools/gitleaks-pin.mjs

# The message, not the diff: the language guard in the test suite reads
# git ls-files and never sees history. 100 of the first 131 messages were Russian
# before anything checked.
commit-msg:
  jobs:
    - name: language
      run: node tools/commit-msg-language.mjs {1}

pre-push:
  parallel: false
  jobs:
    - name: typecheck
      run: pnpm run typecheck

    - name: test
      run: pnpm run test
