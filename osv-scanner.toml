# Исключения OSV-Scanner: только временные и только с разбором досягаемости.
#
# Правило: молчаливых исключений здесь не бывает. У каждой записи есть срок,
# после которого находка возвращается сама, и причина, по которой её можно
# не чинить сегодня. Бессрочное исключение равносильно отключению сканера
# на этой зависимости — тогда честнее выключить сканер целиком и написать
# об этом в README.

[[IgnoredVulns]]
id = "GHSA-2v37-7h3g-55p8"
# Сутки сверх того момента, когда исправление станет ставиться: 3.3.18 вышла
# 7 августа, а `minimumReleaseAge` в этом проекте — 7 суток, то есть версия
# становится доступной 14 августа. Запас на то, чтобы обновить lockfile руками.
ignoreUntil = 2026-08-15
reason = """
nanoid 3.3.17: бесконечный цикл в customAlphabet/customRandom при size = 0 (DoS).

Досягаемости нет, и это проверено, а не предположено:
- зависимость транзитивная и только для разработки — vitest → vite → postcss →
  nanoid; в зависимостях рантайма её нет (там swagger-parser, commander, yaml, zod);
- в публикуемый пакет она не попадает: `files: ["dist"]`, в тарболе 0.2.0
  ни одного файла nanoid;
- postcss зовёт `nanoid(6)` с константой (lib/input.js), size из чужого ввода
  не приходит.

Почему не исправлено сегодня: исправление 3.3.18 вышло 7 августа, а собственный
карантин на свежие релизы (`minimumReleaseAge: 10080`) не пускает пакеты моложе
семи суток. Понижать порог ради находки, до которой нельзя дотянуться, — обмен
защиты от компрометации свежего релиза на защиту от несуществующего DoS.
Правильный размен — подождать сутки.

Действие: 14 августа 2026 обновить lockfile до nanoid 3.3.18 и удалить эту
запись целиком.
"""
