# Ручной список эндпоинтов.
#
# Альтернатива OpenAPI-спецификации: когда спеки нет или ей нельзя доверять.
# barbican принимает три источника — `--spec`, `--endpoints`, `--postman`.
endpoints:
  # Ручка без параметров. Годится как канарейка: отвечает 200 только с рабочим
  # токеном, поэтому по ней видно, что аккаунт вообще аутентифицирован.
  - id: orders.list
    method: GET
    path: /v1/orders

  # Ручка с параметром пути. Здесь живут BOLA и межтенантные утечки: чтобы её
  # опросить, нужно объявить объекты в `resources` конфигурации прогона.
  - id: orders.read
    method: GET
    path: /v1/orders/{orderId}

  # Админская ручка. На ней видна сломанная проверка роли.
  - id: admin.accounts
    method: GET
    path: /v1/admin/accounts
