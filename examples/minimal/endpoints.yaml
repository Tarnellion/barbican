# A hand-written list of endpoints.
#
# An alternative to an OpenAPI specification: for when there is none, or it cannot be
# trusted. barbican takes three sources — `--spec`, `--endpoints`, `--postman`.
endpoints:
  # An endpoint with no parameters. It will do as a canary: it answers 200 only with
  # a working token, so it shows that the account is authenticated at all.
  - id: orders.list
    method: GET
    path: /v1/orders

  # An endpoint with a path parameter. BOLA and cross-tenant leaks live here: to
  # probe it, resources must be declared in `resources` of the run configuration.
  - id: orders.read
    method: GET
    path: /v1/orders/{orderId}

  # The admin endpoint. A broken role check is visible on it.
  - id: admin.accounts
    method: GET
    path: /v1/admin/accounts
