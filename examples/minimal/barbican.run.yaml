# Минимальная конфигурация прогона.
#
# Два тенанта, три аккаунта, три ручки. Полный разбор формата — ADR-0008.
# Работающий пример со стендом и оракулом — каталог `polygon/`.

target:
  baseUrl: http://127.0.0.1:8080/api
  # Обязателен. Без явного перечня хостов инструмент отказывается работать:
  # прогон против незаявленного хоста — это не проверка, а сканирование
  # чужой системы. Запись без порта разрешает любой порт, с портом — ровно один.
  allowedHosts: [127.0.0.1]

accounts:
  # `tokenEnv` — имя переменной окружения, а не сам токен. Секреты в файл
  # конфигурации не попадают: он сериализуется в отчёт.
  - id: alice
    role: user
    tenant: tenant-a
    tokenEnv: TOKEN_ALICE
    # Канарейка: ручка, заведомо доступная этому аккаунту. Если она ответит
    # отказом, значит токен протух, и «находок нет» означает «ничего не проверено».
    canary: orders.list

  - id: carol
    role: user
    tenant: tenant-b
    tokenEnv: TOKEN_CAROL
    canary: orders.list

  # Аккаунт без `tokenEnv` — анонимный. Нужен, чтобы находить сломанную
  # аутентификацию: ручку, которая отвечает вообще без токена.
  - id: anonymous
    role: anonymous
    tenant: tenant-a

# Объекты обращения: чем заполнять параметры пути и кому объект принадлежит.
# Объявляются человеком — из ответов их выуживать нельзя, иначе инструмент
# начнёт сверять реализацию с самой собой (ADR-0010).
resources:
  - id: order-a-1
    tenant: tenant-a
    owner: alice
    params: { orderId: "1001" }

  - id: order-b-1
    tenant: tenant-b
    owner: carol
    params: { orderId: "2001" }

# Ожидаемый доступ. Объявляется человеком и никогда не выводится из спецификации
# проверяемого API: спека порождается из того же кода (ADR-0006).
policy:
  # Что считать ожидаемым для пары, не покрытой ни одним правилом.
  # `denied` — консервативный выбор: лишняя находка заметнее пропущенной.
  fallback: denied

  # Побеждает последнее подошедшее правило.
  rules:
    # `scope: own` — только свои объекты. Чужой объект своего тенанта
    # (`same-tenant`) и любой чужой тенант (`foreign-tenant`) остаются
    # под fallback, то есть объявлены запрещёнными.
    - roles: [user]
      endpoints: [orders.read]
      scope: own
      outcome: allowed

    - roles: [user]
      endpoints: [orders.list]
      outcome: allowed

# Необязательно, но полезно: опечатка в имени тенанта прячет находку, потому что
# объект уезжает в foreign-tenant и правило со scope перестаёт применяться.
tenants: [tenant-a, tenant-b]

# Ручки, которые нельзя трогать. SAFE_METHODS защищает от семантики метода,
# но не от эндпоинта, её нарушающего: GET, сбрасывающий базу, остаётся GET.
# exclude: [dangerous.reset]

# Чтение тел ради скалярных сигналов. Выключено, если секции нет.
#
# Списочная ручка без фильтра по тенанту отвечает 200 и в корректной, и в
# дефектной реализации — по статусу такой дефект неотличим. Здесь объявляются
# ручки, ответ которых обязан различаться между тенантами; совпадение означает
# отсутствующий фильтр. Тело читается только у них, наружу уходит лишь
# необратимый скаляр, само тело не сохраняется нигде (ADR-0011).
bodySignals:
  responseMustDifferByTenant: [orders.list]
