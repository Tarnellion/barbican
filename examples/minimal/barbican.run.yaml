# yaml-language-server: $schema=https://raw.githubusercontent.com/Tarnellion/barbican/main/schema/barbican.run.schema.json

# A minimal run configuration.
#
# Two tenants, three accounts, three endpoints. The walk-through of the format is
# in `docs/guide.md`; why it looks like this is ADR-0008. A working example with a
# deployment and an oracle — the `polygon/` directory.
#
# The line above gives an editor completion and validation as you type. The schema
# is printed by `barbican schema` and comes from the same validator the run uses,
# so it cannot describe a different format than the one that will be accepted.
#
# Before a first run against anything you do not own, try `--dry-run`: it prints
# what would be probed and sends nothing.

target:
  # What was checked, in the words of whoever will read the report. Without it a
  # reader cannot tell a run against a staging deployment from a run against a demo
  # polygon — and the tool warns about that on every start.
  label: local stand, minimal example
  baseUrl: http://127.0.0.1:8080/api
  # Mandatory. Without an explicit list of hosts the tool refuses to work: a run
  # against an undeclared host is not a check but a scan of someone else's system. An
  # entry without a port allows any port, one with a port exactly one.
  allowedHosts: [127.0.0.1]

accounts:
  # `tokenEnv` is the name of an environment variable, not the token itself. Secrets
  # do not get into the configuration file: it is serialized into the report.
  - id: alice
    role: user
    tenant: tenant-a
    tokenEnv: TOKEN_ALICE
    # A canary: an endpoint known to be available to this account. Should it answer
    # with a denial, the token has gone stale, and "there are no findings" means
    # "nothing was tested".
    canary: orders.list

  - id: carol
    role: user
    tenant: tenant-b
    tokenEnv: TOKEN_CAROL
    canary: orders.list

  # An account with no `tokenEnv` is anonymous. It is there to find broken
  # authentication: an endpoint that answers without a token at all.
  #
  # It has no `tenant` field: it is outside of tenants. Attributing it to a tenant (or
  # making up a service name like `none`) would mean declaring the anonymous account
  # a neighbour of somebody's resources — here it would become one of `tenant-a`'s
  # own. Any resource is `foreign-tenant` for an account outside of tenants.
  - id: anonymous
    role: anonymous

# The default authentication scheme. Bearer if it is not set.
# auth: { kind: bearer }

# Surfaces with a scheme of their own are declared by name, and an account refers to
# the name: on a multi-brand platform the affiliate cabinet, the operator console and
# the customer API authenticate differently, while a run must cover them all at once —
# otherwise the "surface × surface" matrix falls apart into reports that cannot be
# stitched together.
#
# A scheme describes the transport only. There are no secrets here in any form: the
# token comes from the variable the account names. An unexpected key is an error, not
# a silently discarded field.
#
# A reference by name rather than a scheme written out on every account: the cookie
# name and the header name belong to the surface, and repeated on every account they
# will diverge by a typo — and a typo in a cookie name is indistinguishable from the
# right name, gives 401, and the report looks clean. A typo in the reference stops the
# run at startup.
#
# A scheme nobody referred to also stops the run: usually that is a forgotten
# `authScheme` on an account, that is, a run over the wrong surface.
#
# authSchemes:
#   operator-console: { kind: cookie, name: opsid }
#   affiliate-cabinet: { kind: header, header: X-Affiliate-Key }
#
# accounts:
#   - id: olga-op
#     role: operator
#     tenant: tenant-a
#     tokenEnv: TOKEN_OLGA
#     authScheme: operator-console

# The resources requests address: what to fill the path parameters with and who owns
# the resource. Declared by a human — they must not be fished out of the responses,
# or the tool starts comparing the implementation with itself (ADR-0010).
resources:
  - id: order-a-1
    tenant: tenant-a
    owner: alice
    params: { orderId: "1001" }

  - id: order-b-1
    tenant: tenant-b
    owner: carol
    params: { orderId: "2001" }

# The expected access. Declared by a human and never derived from the specification
# of the API under test: the spec is generated from the same code (ADR-0006).
policy:
  # What to consider expected for a pair no rule covers. `denied` is the conservative
  # choice: an extra finding is more noticeable than a missed one.
  fallback: denied

  # The last matching rule wins.
  rules:
    # `scope: own` — one's own resources only. Another user's resource in one's own
    # tenant (`same-tenant`) and any foreign tenant (`foreign-tenant`) stay under the
    # fallback, that is, are declared forbidden.
    - roles: [user]
      endpoints: [orders.read]
      scope: own
      outcome: allowed

    - roles: [user]
      endpoints: [orders.list]
      outcome: allowed

# Optional, but useful: a typo in a tenant name hides a finding, because the resource
# drifts into foreign-tenant and the rule with a scope stops applying.
tenants: [tenant-a, tenant-b]

# The endpoints that must not be touched. SAFE_METHODS protects against the semantics
# of the method, but not against an endpoint that violates it: a GET that resets the
# database is still a GET.
# exclude: [dangerous.reset]

# Reading bodies for the sake of scalar signals. Off if the section is absent.
#
# A list endpoint with no tenant filter answers 200 both in a correct and in a
# defective implementation — such a defect is indistinguishable by status. Here the
# endpoints are declared whose response must differ between tenants; a match means
# the filter is absent. Bodies are read on those endpoints only, nothing but an
# irreversible scalar leaves, and the body itself is not stored anywhere (ADR-0011).
bodySignals:
  responseMustDifferByTenant: [orders.list]
