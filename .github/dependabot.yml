version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # The same principle as minimumReleaseAge in pnpm-workspace.yaml:
    # do not pull versions that have just been published.
    cooldown:
      default-days: 7
      semver-major-days: 30
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # The TypeScript 7 block was lifted on 19 August 2026: the shipped package no
      # longer calls itself a preview, and the API that is still unstable is one
      # this project does not import. See ADR-0031.
      # The Node 22 line of types is pinned to engines: >=22.12.0. Types from
      # Node 26 would smuggle in APIs that do not exist on 22, and the typecheck
      # would stop reflecting reality.
      - dependency-name: "@types/node"
        versions: [">=23.0.0"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(ci)"
