version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # The same principle as minimumReleaseAge in pnpm-workspace.yaml:
    # do not pull versions that have just been published.
    cooldown:
      default-days: 7
      semver-major-days: 30
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # TypeScript 7 is kept aside deliberately: by its own README it is a preview
      # with "API: not ready", while tsc --noEmit is a CI gate. See ADR-0001.
      # Lift the block once 7.x leaves preview.
      - dependency-name: "typescript"
        versions: [">=7.0.0"]
      # The Node 22 line of types is pinned to engines: >=22.12.0. Types from
      # Node 26 would smuggle in APIs that do not exist on 22, and the typecheck
      # would stop reflecting reality.
      - dependency-name: "@types/node"
        versions: [">=23.0.0"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(ci)"
