name: Release

# Publishing happens on a tag, not on a push to main: a human puts the tag there,
# and that is the only action a release needs. Publishing on every commit would
# turn an ordinary typo into a version in the registry.
on:
  push:
    tags: ["v*"]

# Read-only by default. `id-token` is needed by exactly one job, and only so that
# npm issues short-lived credentials over OIDC: a long-lived token in the
# repository secrets is precisely what this moves away from.
permissions:
  contents: read

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  publish:
    name: publish to npm with provenance
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # Actions are pinned by SHA: a tag can be moved to another commit.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # 24 is the upper bound of declared support. Building the release on it
          # rather than on the lower bound tests the package where it is newest.
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing requires npm >= 11.5.1. The version is pinned rather
      # than `@latest`: a release must not depend on what came out this morning.
      - name: Pin npm
        run: |
          set -euo pipefail
          npm install -g npm@11.19.0
          npm --version

      - name: Enable pnpm via corepack
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      # The same gate as CI. A tag can be put on a commit that CI never ran on —
      # and a release must have run it.
      - name: Check
        run: pnpm run check

      # The package version must match the tag. Otherwise the registry receives
      # something other than what history marks, and there is no way left to tie
      # a release to a commit.
      - name: Verify tag matches package version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "Tag v$tag does not match the package version $pkg" >&2
            exit 1
          fi

      # Neither NODE_AUTH_TOKEN nor NPM_TOKEN: OIDC issues the credentials and
      # they live for minutes. Provenance is signed automatically — it is enabled
      # in publishConfig and is not duplicated by a flag here.
      - name: Publish
        run: npm publish
