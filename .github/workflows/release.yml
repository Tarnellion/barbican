name: Release

# Publishing happens on a tag, not on a push to main: a human puts the tag there,
# and that is the only action a release needs. Publishing on every commit would
# turn an ordinary typo into a version in the registry.
on:
  push:
    tags: ["v*"]

# Read-only by default. `id-token` is needed by exactly one job, and only so that
# npm issues short-lived credentials over OIDC: a long-lived token in the
# repository secrets is precisely what this moves away from.
permissions:
  contents: read

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  # The whole CI gate, not a copy of one job of it.
  #
  # This used to be a single `pnpm run check` step inside `publish`, with a
  # comment claiming it was "the same gate as CI". It was one gate of four: the
  # secret scan over the full history, the verification against the hand-written
  # oracle and the vulnerability scan were all absent, so a tag could publish —
  # with provenance attesting to it — a commit that three quarters of CI had
  # never seen. Found by the audit of 14 August.
  #
  # Called rather than duplicated: two lists of the same steps drift, and this
  # one would drift in the half nobody looks at until a release.
  gate:
    name: CI gate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    name: publish to npm with provenance
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # Actions are pinned by SHA: a tag can be moved to another commit.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The branches, not just the tagged commit. The gate below asks whether
          # `main` carries this commit, and the default depth of one answers "I
          # cannot see" — which, taken as agreement, is the shape of guard this
          # repository keeps finding in its own CI.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # 24 is the upper bound of declared support. Building the release on it
          # rather than on the lower bound tests the package where it is newest.
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing requires npm >= 11.5.1. The version is pinned rather
      # than `@latest`: a release must not depend on what came out this morning.
      - name: Pin npm
        run: |
          set -euo pipefail
          npm install -g npm@11.19.0
          npm --version

      # Everything about this tag that CI cannot be asked, because on a pull
      # request there is no tag: whether it names the version the package
      # declares, whether `main` carries the commit under it, which dist-tag the
      # publish takes, whether the registry already has that version, and whether
      # the README describes what is being released.
      #
      # Before the install and the build on purpose: a tag that is going to be
      # refused is refused before anything is built, and the script needs nothing
      # but node and git to say so. The reasoning for each of the five is in
      # tools/release-gate.mjs and in ADR-0049; the answers are held by
      # tests/tools/release-gate.test.ts and this step by
      # tests/workflows/release-gate.test.ts.
      - name: Ask what only a release can be asked
        id: gate
        run: |
          set -euo pipefail
          # `fetch-depth: 0` brings the branches, and this makes sure of the one
          # the ancestry question needs even if that ever stops being true.
          git fetch --no-tags --quiet origin +refs/heads/main:refs/remotes/origin/main
          node tools/release-gate.mjs

      - name: Enable pnpm via corepack
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      # Only the build here: verification is the `gate` job above, and repeating
      # it would say that this step is what guards the release. `npm publish`
      # ships `dist`, so it has to exist.
      - name: Build
        run: pnpm run build

      # Neither NODE_AUTH_TOKEN nor NPM_TOKEN: OIDC issues the credentials and
      # they live for minutes. Provenance is signed automatically — it is enabled
      # in publishConfig and is not duplicated by a flag here.
      #
      # `--tag` is not: with no flag npm writes `latest`, and `v0.5.0-rc.1`
      # matches the trigger of this workflow, so a release candidate would become
      # what `npm install barbican` hands out. The channel is computed from the
      # version by the gate step — `latest` for a release, `rc` for `0.5.0-rc.1`.
      # `:?` rather than a bare expansion: an empty output must fail here rather
      # than fall back to npm's default, which is the very value being avoided.
      - name: Publish
        env:
          DIST_TAG: ${{ steps.gate.outputs.dist-tag }}
        run: |
          set -euo pipefail
          npm publish --tag "${DIST_TAG:?the release gate computed no dist-tag}"
