name: CI

on:
  push:
    branches: [main]
  pull_request:

# Минимальные права по умолчанию: расширять точечно и только там, где нужно.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Не спрашивать подтверждения на скачивание менеджера пакетов из packageManager.
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  check:
    name: lint / typecheck / test / build (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 — версия разработки, 24 — верхняя граница заявленной поддержки.
        node: [22, 24]
    steps:
      # Actions запинены по SHA: тег можно передвинуть на другой коммит.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      - name: Enable pnpm via corepack
        run: corepack enable

      # Установка строго по lockfile: без переразрешения версий.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Полная история: pre-commit ловит только новое, здесь проверяем всё.
          fetch-depth: 0

      # Дублирует pre-commit-хук: локальный хук обходится через --no-verify.
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
