name: CI

on:
  push:
    branches: [main]
  pull_request:

# Минимальные права по умолчанию: расширять точечно и только там, где нужно.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Не спрашивать подтверждения на скачивание менеджера пакетов из packageManager.
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  check:
    name: lint / typecheck / test / build (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 — версия разработки, 24 — верхняя граница заявленной поддержки.
        node: [22, 24]
    steps:
      # Actions запинены по SHA: тег можно передвинуть на другой коммит.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      - name: Enable pnpm via corepack
        run: corepack enable

      # Установка строго по lockfile: без переразрешения версий.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      # С покрытием: пороги в vitest.config.ts — часть гейта, а не отчёт для чтения.
      - name: Test
        run: pnpm run test:coverage

      - name: Build
        run: pnpm run build

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    # Версия совпадает с локальной, чтобы CI и pre-commit не расходились в вердиктах.
    # Бинарь ставится напрямую, а не через gitleaks-action: action считает диапазон
    # коммитов от родителя первого коммита, которого не существует, и падает на
    # первом пуше. Плюс он тянет свою, более старую версию gitleaks.
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Полная история: pre-commit ловит только новое, здесь проверяем всё.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "$url" -o gitleaks.tar.gz
          # Скачанный бинарь проверяется по закреплённой сумме: загрузка из сети
          # без проверки — тот же класс риска, от которого защищает вся остальная политика.
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      # Дублирует pre-commit-хук: локальный хук обходится через --no-verify.
      - name: Scan full history
        run: ./gitleaks git --redact --no-banner .
