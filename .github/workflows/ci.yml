name: CI

on:
  push:
    branches: [main]
  pull_request:

# Минимальные права по умолчанию: расширять точечно и только там, где нужно.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Не спрашивать подтверждения на скачивание менеджера пакетов из packageManager.
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  check:
    name: lint / typecheck / test / build (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 — версия разработки, 24 — верхняя граница заявленной поддержки.
        node: [22, 24]
    steps:
      # Actions запинены по SHA: тег можно передвинуть на другой коммит.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      - name: Enable pnpm via corepack
        run: corepack enable

      # Установка строго по lockfile: без переразрешения версий.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      # С покрытием: пороги в vitest.config.ts — часть гейта, а не отчёт для чтения.
      - name: Test
        run: pnpm run test:coverage

      - name: Build
        run: pnpm run build

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    # Версия совпадает с локальной, чтобы CI и pre-commit не расходились в вердиктах.
    # Бинарь ставится напрямую, а не через gitleaks-action: action считает диапазон
    # коммитов от родителя первого коммита, которого не существует, и падает на
    # первом пуше. Плюс он тянет свою, более старую версию gitleaks.
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Полная история: pre-commit ловит только новое, здесь проверяем всё.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "$url" -o gitleaks.tar.gz
          # Скачанный бинарь проверяется по закреплённой сумме: загрузка из сети
          # без проверки — тот же класс риска, от которого защищает вся остальная политика.
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      # Дублирует pre-commit-хук: локальный хук обходится через --no-verify.
      - name: Scan full history
        run: ./gitleaks git --redact --no-banner .

  polygon:
    name: oracle (reference polygon, 25 combinations)
    runs-on: ubuntu-latest
    # Самая сильная проверка правильности в проекте гонялась только на моей
    # машине и только когда я о ней вспоминал. Стенд — чистый Node, без Docker:
    # поднимается и гасится самим verify.mjs, около полутора минут на все
    # двадцать пять комбинаций флагов.
    #
    # Сверяются не числа в README, а находки ячейка в ячейку с рукописным
    # оракулом. Расхождение означает либо регрессию инструмента, либо ошибку
    # в оракуле — и то и другое надо знать до слияния, а не через неделю.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Enable pnpm via corepack
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      # Полигон гоняет собранный CLI, а не исходники: так проверяется ровно то,
      # что уедет в пакет. Разошедшись, dist и src дали бы зелёную сверку
      # на коде, которого пользователь не увидит.
      - name: Build
        run: pnpm run build

      - name: Verify against the hand-written oracle
        run: node polygon/verify.mjs

  vulnerabilities:
    name: known vulnerabilities (OSV)
    runs-on: ubuntu-latest
    # Второй слой поверх `pnpm audit`: OSV агрегирует источники, которых нет
    # в реестре npm, — GHSA, CVE, базы дистрибутивов. Совпадение вердиктов
    # ничего не стоит, расхождение стоит того, чтобы о нём узнать.
    #
    # Бинарь ставится напрямую и сверяется по закреплённой сумме — та же
    # причина, что у gitleaks: action тянет свою версию, и вердикты CI
    # разъезжаются с локальными молча.
    #
    # Версия на шаг позади свежей намеренно: v2.5.0 вышла неделю назад,
    # а `minimumReleaseAge` в этом проекте — 7 суток не случайно.
    env:
      OSV_VERSION: "2.4.0"
      OSV_SHA256: "15314940c10d26af9c6649f150b8a47c1262e8fc7e17b1d1029b0e479e8ed8a0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install osv-scanner
        run: |
          set -euo pipefail
          url="https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64"
          curl -sSfL "$url" -o osv-scanner
          echo "${OSV_SHA256}  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner
          ./osv-scanner --version

      # Сканируется lockfile, а не установленное дерево: так вердикт зависит
      # от того, что объявлено, и воспроизводится без установки.
      - name: Scan lockfile
        run: ./osv-scanner scan source --lockfile=pnpm-lock.yaml
