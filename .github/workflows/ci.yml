name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Callable, so that a release runs these very jobs rather than a copy of them.
  # A release used to run one of the four — `pnpm run check` — and a tag could
  # therefore publish a commit that the secret scan, the oracle and the
  # vulnerability scan had never seen. Duplicating the steps into release.yml
  # would have started the same drift one commit later.
  workflow_call:

# Least privilege by default: widen it one job at a time, only where needed.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Do not prompt before downloading the package manager named in packageManager.
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  check:
    name: lint / typecheck / test / build (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 22 is the development version, 24 the upper bound of declared support.
        #
        # Windows is here because the gate could not run there at all: `build` is
        # the last step of `check` and it ended in `chmod`, which Windows has no
        # command for. Fixing that without a job to run it on would have been a
        # claim rather than a check — every job in this file was
        # `ubuntu-latest`, so nothing would ever have said whether it worked.
        # Found by the audit of 14 August 2026 (K-7).
        #
        # One Windows entry and not a full second column: what is under test is
        # whether the contributor's gate runs on the platform, and that answer
        # does not differ between node 22 and 24. The development version is the
        # one that gets it.
        include:
          - { os: ubuntu-latest, node: 22 }
          - { os: ubuntu-latest, node: 24 }
          - { os: windows-latest, node: 22 }
    steps:
      # Actions are pinned by SHA: a tag can be moved to another commit.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      - name: Enable pnpm via corepack
        run: corepack enable

      # Install strictly from the lockfile: no version re-resolution.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      # With coverage: the thresholds in vitest.config.ts are part of the gate,
      # not a report to read.
      - name: Test
        run: pnpm run test:coverage

      - name: Build
        run: pnpm run build

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    # The version matches the local one so that CI and pre-commit never differ in
    # their verdicts. The binary is installed directly rather than through
    # gitleaks-action: the action computes a commit range from the parent of the
    # first commit, which does not exist, and fails on the first push. It also
    # pulls its own, older version of gitleaks.
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: pre-commit only catches what is new, here everything is checked.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "$url" -o gitleaks.tar.gz
          # The downloaded binary is verified against a pinned checksum: fetching
          # from the network without a check is the same class of risk the rest of
          # this policy guards against.
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      # Duplicates the pre-commit hook: the local hook can be skipped with --no-verify.
      - name: Scan full history
        run: ./gitleaks git --redact --no-banner .

  polygon:
    name: oracle (reference polygon)
    runs-on: ubuntu-latest
    # The strongest correctness check in the project used to run on one machine
    # only, and only when its author remembered it. The deployment is plain Node,
    # no Docker: verify.mjs brings it up and takes it down itself, a minute or two
    # for every combination of flags in the oracle.
    #
    # The count is deliberately absent from the name and from this comment: it
    # said twenty-five while the oracle held twenty-eight, and a number woven
    # into prose is one no test can keep honest.
    #
    # What is compared is not the numbers in the README but the findings, cell by
    # cell, against a hand-written oracle. A mismatch means either a regression in
    # the tool or an error in the oracle — both are worth knowing before a merge,
    # not a week later.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Enable pnpm via corepack
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      # The polygon runs the built CLI rather than the sources: that way exactly
      # what ships in the package is what gets tested. Had dist and src drifted
      # apart, the verification would be green on code the user never sees.
      - name: Build
        run: pnpm run build

      # `--check-readme` additionally compares the results table in the README
      # against this very run: the numbers in the document drifted away from the
      # code twice, and both times nobody noticed for weeks.
      - name: Verify against the hand-written oracle
        run: node polygon/verify.mjs --check-readme

  vulnerabilities:
    name: known vulnerabilities (OSV)
    runs-on: ubuntu-latest
    # A second layer on top of `pnpm audit`: OSV aggregates sources the npm
    # registry does not carry — GHSA, CVE, distribution databases. Agreeing
    # verdicts cost nothing; a disagreement is worth knowing about.
    #
    # The binary is installed directly and verified against a pinned checksum —
    # the same reason as with gitleaks: an action pulls its own version, and CI
    # verdicts drift away from local ones silently.
    #
    # The version is deliberately behind the newest by the same seven days
    # `minimumReleaseAge` applies to every dependency: v2.5.1 was published today
    # and v2.5.0 ten days ago, so v2.5.0 is what a cooldown of a week allows.
    #
    # **This pin carries the condition for its own removal**, like the entries in
    # `overrides` and the exceptions in `osv-scanner.toml`: raise it whenever a
    # release is more than seven days old. No dependabot ecosystem covers a
    # binary fetched by URL — there is no such ecosystem — so nothing will
    # announce a new one, and a pin nobody revisits is a pin nobody notices. The
    # previous one sat at v2.4.0 with a note saying v2.5.0 was "a week ago",
    # which by the time anybody read it had been true for two months. Found by
    # the audit of 14 August 2026 (F-5).
    env:
      OSV_VERSION: "2.5.0"
      OSV_SHA256: "edcfc41d257db36148f065055655fe3fcfc434b0b423ea67468a84c207524e0c"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install osv-scanner
        run: |
          set -euo pipefail
          url="https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64"
          curl -sSfL "$url" -o osv-scanner
          echo "${OSV_SHA256}  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner
          ./osv-scanner --version

      # The lockfile is scanned rather than the installed tree: that way the
      # verdict depends on what is declared and reproduces without an install.
      - name: Scan lockfile
        run: ./osv-scanner scan source --lockfile=pnpm-lock.yaml

      # The second layer, which ADR-0004 declares and nothing ran — not in CI and
      # not in the hooks, so "two layers" was one. They ask different databases:
      # osv-scanner reads OSV, `pnpm audit` reads the npm advisory database, and
      # an advisory can be in either before the other. Found by the audit of
      # 14 August 2026 (F-6).
      #
      # Needs the package manager and the lockfile, which the scan above does
      # not, hence the two steps here rather than one.
      - name: Enable pnpm via corepack
        run: corepack enable

      - name: Advisories from the npm database
        run: pnpm audit --audit-level moderate

  package:
    name: the artifact as it ships
    runs-on: ubuntu-latest
    # Nothing checked the package itself. A cold install of 0.2.0 found a README
    # that argued against the version it shipped with, a tarball with no guide
    # and no example, and an adapter that reached the build but not `exports` —
    # every one of them would have passed a release unnoticed, because a release
    # ran `pnpm run check` and stopped there.
    #
    # What is verified here is the artifact, not the sources: the tarball is
    # built, inspected, installed into an empty directory and driven from there.
    # That is the closest thing to "npx on someone else's machine" that does not
    # require someone else's machine.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Enable pnpm via corepack
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      # `files` ships `dist`, so the tarball is only as honest as the build.
      - name: Build
        run: pnpm run build

      - name: Pack
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pack"
          pnpm pack --pack-destination "$RUNNER_TEMP/pack"
          ls -l "$RUNNER_TEMP/pack"

      # Versions are pinned rather than @latest, for the same reason every other
      # tool here is: a gate must not change its verdict because something came
      # out this morning.
      - name: publint
        run: pnpm dlx publint@0.3.23 run

      # `--profile esm-only` is deliberate, not a way of quieting the tool. By
      # default attw fails this package on two counts, and both are inapplicable:
      # node10 resolution, which no ESM-only package satisfies, and "a require
      # call resolved to ESM", which stopped being an error in Node 22.12 — the
      # floor this package declares. Left on the default profile the job would be
      # red on every run, and a job that is always red is a job somebody deletes,
      # taking the checks that do work with it.
      - name: are the types wrong
        run: |
          set -euo pipefail
          tarball="$(ls "$RUNNER_TEMP"/pack/*.tgz)"
          pnpm dlx @arethetypeswrong/cli@0.18.5 --profile esm-only "$tarball"

      # The part no static check can answer: does the thing run once installed.
      # Not from this repository — from an empty directory, the way a user gets it.
      - name: Install from the tarball and drive the CLI
        run: |
          set -euo pipefail
          tarball="$(ls "$RUNNER_TEMP"/pack/*.tgz)"
          work="$RUNNER_TEMP/consumer"
          mkdir -p "$work"
          cd "$work"
          npm init -y > /dev/null
          npm install --no-audit --no-fund "$tarball"
          npx barbican --version
          npx barbican run --help
          # The schema is generated from the same zod schema the run validates
          # against; printing it proves the command works from the package.
          npx barbican schema > schema.json
          node -e "JSON.parse(require('node:fs').readFileSync('schema.json','utf8'))"
          # The starter configuration ships, and `--dry-run` sends nothing: a
          # complete parse and validation without touching any network.
          npx barbican run \
            --config node_modules/barbican/examples/minimal/barbican.run.yaml \
            --endpoints node_modules/barbican/examples/minimal/endpoints.yaml \
            --dry-run
          # The README tells the reader the schema is under `node_modules/barbican/`
          # and an editor picks it up from there. `exports` declared neither it nor
          # `package.json`, so neither could be resolved by name — the directory
          # shipped and the door was locked. Resolved here rather than read off the
          # disk: what is under test is `exports`, and a file that exists is not
          # the same as a file a tool can ask for.
          node --input-type=module -e "
            import { createRequire } from 'node:module';
            const require = createRequire(process.cwd() + '/');
            for (const name of ['barbican/package.json', 'barbican/schema/barbican.run.schema.json']) {
              const at = require.resolve(name);
              console.log(name, '->', at);
            }
          "
          # Source maps that point at sources the package does not carry are 212 KB
          # of files resolving to nothing. They stay in the build for local
          # debugging and out of the tarball.
          if find node_modules/barbican/dist -name '*.map' | grep -q .; then
            echo "the package ships source maps that point at sources it does not carry" >&2
            exit 1
          fi
