# Supply-chain hardening. Rationale: docs/adr/0004-supply-chain-hardening.md
#
# Do not remove or weaken these settings without an ADR.

# Do not install versions younger than 7 days (10080 minutes).
# Compromised versions are usually pulled within hours — the cooldown catches that.
minimumReleaseAge: 10080

# Add emergency patches here one by one, in the form: pkg@1.2.3
minimumReleaseAgeExclude: []

# Fail the install when a dependency has lifecycle scripts that are not in
# allowBuilds. Nothing may run silently.
strictDepBuilds: true

# An explicit allowlist of packages permitted to run build scripts.
# Empty by default, and it should stay that way.
#
# lefthook: its postinstall does exactly one thing — runs `lefthook install -f`,
# that is, writes hooks into .git/hooks. It does not touch the network (get-exe.js
# resolves the binary from an optional dependency locally). Instead of permitting
# the script, the same step is done explicitly: `pnpm run hooks:install`.
allowBuilds:
  lefthook: false

# Exact versions in package.json — no ranges.
savePrefix: ''
