# Supply-chain hardening. Rationale: docs/adr/0004-supply-chain-hardening.md
#
# Do not remove or weaken these settings without an ADR.

# Do not install versions younger than 7 days (10080 minutes).
# Compromised versions are usually pulled within hours — the cooldown catches that.
minimumReleaseAge: 10080

# Add emergency patches here one by one, in the form: pkg@1.2.3
minimumReleaseAgeExclude: []

# Fail the install when a dependency has lifecycle scripts that are not in
# allowBuilds. Nothing may run silently.
strictDepBuilds: true

# An explicit allowlist of packages permitted to run build scripts.
# Empty by default, and it should stay that way.
#
# lefthook: its postinstall does exactly one thing — runs `lefthook install -f`,
# that is, writes hooks into .git/hooks. It does not touch the network (get-exe.js
# resolves the binary from an optional dependency locally). Instead of permitting
# the script, the same step is done explicitly: `pnpm run hooks:install`.
allowBuilds:
  lefthook: false

# Refuse to install on a Node below `engines`: an error rather than strange
# failures later.
#
# It lived in `.npmrc` as `engine-strict=true` and did nothing there. Under
# pnpm 11 that file is read for authentication and the registry only, and every
# other setting has to be here under a camelCase key — so the guard had been off
# since the upgrade and nothing said so. Measured rather than assumed: with this
# line and an `engines.node` of `>=99`, `pnpm install` refuses; with the `.npmrc`
# key instead, it says "Already up to date". Found by the audit of 14 August 2026
# (F-3).
engineStrict: true

# Exact versions in package.json — no ranges. This is the pnpm name for what
# `.npmrc` called `save-exact`, and the reason that file is gone.
savePrefix: ''

# Versions forced on a transitive dependency the direct ones will not lift.
#
# Every entry here is a standing decision, so every entry says when it stops
# being needed. An override nobody removes becomes a pin nobody notices — the
# same failure as an exception in osv-scanner.toml with no expiry.
#
# `pnpm update nanoid` does nothing for a transitive dependency: it matches
# against what package.json declares, and answers "Already up to date" while
# leaving the lockfile alone. pnpm's own documentation recommends an override
# for this, and this is that.
