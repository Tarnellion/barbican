# Защита цепочки поставок. Обоснование: docs/adr/0004-supply-chain-hardening.md
#
# Не удалять и не ослаблять эти настройки без записи в ADR.

# Не устанавливать версии моложе 7 суток (10080 минут).
# Скомпрометированные версии обычно отзывают в течение часов — cooldown это ловит.
minimumReleaseAge: 10080

# Экстренные патчи вносить сюда точечно, вида: pkg@1.2.3
minimumReleaseAgeExclude: []

# Падать при установке, если у зависимости есть lifecycle-скрипты,
# которых нет в allowBuilds. Молчаливого выполнения быть не должно.
strictDepBuilds: true

# Явный allowlist пакетов, которым разрешено выполнять скрипты сборки.
# Пусто по умолчанию и должно таким остаться.
#
# lefthook: его postinstall делает ровно одно — запускает `lefthook install -f`,
# то есть пишет хуки в .git/hooks. Сети не трогает (get-exe.js резолвит бинарь
# из optional-зависимости локально). Вместо разрешения скрипта тот же шаг
# выполняется явно: `pnpm run hooks:install`.
allowBuilds:
  lefthook: false

# Точные версии в package.json — без диапазонов.
savePrefix: ''
