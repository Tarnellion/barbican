# Наложение поверх официального compose crAPI. Передаётся вторым `-f`, файлы
# самого crAPI не правятся: это чужой проект под своей лицензией.
#
# Чат-бот не поднимается: образ 1,18 ГБ, тянет внешний LLM, а к матрице
# «роль × эндпоинт» отношения не имеет. Но nginx веб-контейнера резолвит все
# апстримы на старте и без чат-бота падает, поэтому имя даётся заглушкой на петлю.
#
# Адрес публикации портов задаётся не здесь, а переменной LISTEN_IP, которую
# verify.mjs выставляет в 127.0.0.1 явно: `ports` в наложении не заменяют
# исходные, а добавляются к ним, и «сузить» привязку так нельзя.
services:
  crapi-web:
    extra_hosts:
      - "crapi-chatbot:127.0.0.1"
