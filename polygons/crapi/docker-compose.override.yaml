# An override on top of crAPI's official compose. Passed as the second `-f`; crAPI's
# own files are not edited: it is someone else's project under its own licence.
#
# The chatbot is not brought up: the image is 1.18 GB, it pulls an external LLM, and
# it has nothing to do with the "role × endpoint" matrix. But the web container's
# nginx resolves all upstreams at startup and falls over without the chatbot, so the
# name is given a stub pointing at the loopback.
#
# The publication address of the ports is set not here but by the LISTEN_IP variable,
# which verify.mjs sets to 127.0.0.1 explicitly: `ports` in an override do not replace
# the original ones but are added to them, and the binding cannot be "narrowed" that
# way.
services:
  crapi-web:
    extra_hosts:
      - "crapi-chatbot:127.0.0.1"
