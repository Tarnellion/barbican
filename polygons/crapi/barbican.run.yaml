# A barbican run against crAPI (OWASP). The format — ADR-0008.
#
# crAPI is single-tenant: it has no notion of a "tenant" at all. To apply the
# isolation model, every user is declared a tenant of its own — then another user's
# order or another user's vehicle becomes foreign-tenant, and BOLA is visible as "200
# where a denial is declared".
#
# There are no tokens here: an account names an environment variable. The operator
# logs in outside the tool (POST /identity/api/auth/login) and puts the tokens into
# the env. The passwords of crAPI's pre-seeded users: <local-part>!123 (Test!123,
# Admin!123).
target:
  baseUrl: http://127.0.0.1:8888
  allowedHosts: [127.0.0.1]
  # The label is mandatory for the same reason it is there on our own polygon:
  # without it the report does not name the system under test, and a ticket cannot be
  # filed from it. Here it also says the main thing — this is a training application
  # with deliberate vulnerabilities, not somebody's deployment.
  label: OWASP crAPI (a training application with deliberate vulnerabilities)
tenants: [t-adam, t-pogba, t-admin, t-none]
accounts:
  - id: adam
    role: user
    tenant: t-adam
    tokenEnv: CRAPI_TOKEN_ADAM
    canary: get_vehicles
  - id: pogba
    role: user
    tenant: t-pogba
    tokenEnv: CRAPI_TOKEN_POGBA
    canary: get_vehicles
  - id: admin
    role: admin
    tenant: t-admin
    tokenEnv: CRAPI_TOKEN_ADMIN
    canary: get_vehicles
  # The anonymous account: no token. It tests the claim "this endpoint is not public".
  - id: anonymous
    role: anonymous
    tenant: t-none
# The resources and their owners (ADR-0010). The identifiers are declared by a human:
# bodies are not read. The vehicle UUIDs and the order ids are real — from crAPI's seed.
resources:
  - id: vehicle-adam
    tenant: t-adam
    owner: adam
    params:
      vehicleId: f89b5f21-7829-45cb-a650-299a61090378
  - id: vehicle-pogba
    tenant: t-pogba
    owner: pogba
    params:
      vehicleId: cd515c12-0fc1-48ae-8b61-9230b70a845b
  - id: order-adam
    tenant: t-adam
    owner: adam
    params:
      order_id: "1"
  - id: order-pogba
    tenant: t-pogba
    owner: pogba
    params:
      order_id: "2"
  # A service report: the identifier is in the query, so the endpoint is named
  # explicitly (ADR-0010). There is no owner among the accounts — for everyone this is
  # a foreign tenant.
  - id: report-1
    tenant: t-none
    query:
      report_id: "1"
    endpoints: [get_report_byID]
policy:
  fallback: denied
  rules:
    # The lists and the personal endpoints meant for any authenticated account. The
    # anonymous one does not get here: the anonymous role has no access, and its
    # 401/404 will agree with the fallback.
    - roles: [user, admin]
      endpoints:
        - get_dashboard
        - get_vehicles
        - get_recent_posts
        - get_products
        - get_orders
        - get_mechanics
        - get_service_requests_for_mechanic
      outcome: allowed
    # The shop's QR code is meant for an authenticated account. The anonymous one is
    # under fallback denied: the endpoint serves 200 without a token, and that is
    # broken authentication (visible in the status).
    - roles: [user, admin]
      endpoints: [get_workshop_qr_code]
      outcome: allowed
    # The list of all users — for the administrator only. A 200 to an ordinary user
    # here is BFLA.
    - roles: [admin]
      endpoints: [get_workshop_users_all]
      outcome: allowed
    # One's own order, one's own vehicle, one's own report — for the owner. The others
    # are under fallback denied: crAPI does not check ownership and serves 200 — that
    # is BOLA, visible in the status.
    - roles: [user, admin]
      endpoints: [get_order_byID, get_location, get_report_byID]
      scope: own
      outcome: allowed
# The list endpoints whose response MUST differ between users: each has vehicles,
# orders and a dashboard of its own. A match of digests would mean the filter is
# absent — a defect that does not change the status (ADR-0011). The body is read here
# only. The public get_recent_posts/get_products and the BFLA get_workshop_users_all
# are deliberately NOT entered here: they are lawfully the same for everyone, and the
# mark would give a false positive.
bodySignals:
  responseMustDifferByTenant: [get_vehicles, get_orders, get_dashboard]
# A write hidden behind a method that is safe by the letter. GET
# /workshop/api/mechanic/receive_report is called create_service_report in the
# specification, is described as "Create and Assign a Service Report" and is declared
# without authentication. The safe mode will not stop it — the method is a GET, after
# all — so the endpoint is excluded by name. Without the mandatory parameters it
# answers 400 and gives a probe-error on every account; with the parameters it would
# create a report in the deployment.
exclude: [create_service_report]
