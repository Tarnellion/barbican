# The run configuration against VAmPI (the format — ADR-0008).
#
# There are no tokens here: an account names an environment variable. The values are
# set by `tokens.mjs` (it registers users with random passwords and logs in as them)
# or by the operator by hand — see README.md.
#
# The policy is a human's declaration of how a correct API must behave, not a retelling
# of VAmPI's behaviour (ADR-0006). That is where the findings come from: where the
# declared diverges from the observed, there is a defect.

target:
  # The port must match VAMPI_PORT in docker-compose.yaml. `verify.mjs` takes the port
  # from here and passes it to compose — there is nowhere for them to diverge.
  baseUrl: http://127.0.0.1:5002
  allowedHosts: [127.0.0.1]
  # Without a label the report does not name the system under test. Here it says both
  # that this is a training application and in which mode it was brought up: VAmPI's
  # defects are switched by an environment variable, and "clean" cannot be read
  # without the mode.
  label: VAmPI (a training application with switchable vulnerabilities)

# The list is mandatory not for the looks of it: a typo in a tenant name drives the
# resource into foreign-tenant, the rule with a scope stops applying, and a real
# finding falls through to fallback: denied — that is, disappears.
tenants: [vampi, none]

accounts:
  # VAmPI is single-tenant: there is one tenant for everyone, and a cross-tenant leak
  # cannot be modelled here. The other half is tested — BOLA inside a tenant, which is
  # what two equal users are needed for.
  - id: alice
    role: user
    tenant: vampi
    tokenEnv: VAMPI_TOKEN_ALICE
    # `/me` is the only endpoint where VAmPI itself demands a token. The rest would
    # answer 200 with a broken token too, that is, they cannot serve as canaries.
    canary: me
  - id: bob
    role: user
    tenant: vampi
    tokenEnv: VAMPI_TOKEN_BOB
    canary: me

  # The anonymous account: no token. Half the findings here are "this endpoint must
  # not be public", and without such an account they are unreachable.
  # The tenant `none` is a service one: any resource is foreign-tenant for the
  # anonymous account.
  - id: anonymous
    role: anonymous
    tenant: none

# The admin role is deliberately not introduced. In VAmPI it grants exactly one
# permission — `DELETE /users/v1/{username}`, that is, an unsafe method the tool does
# not go to. An administrator account would give a column of the matrix identical to
# the user's and would create the appearance of the role being covered.

# The resources requests address (ADR-0010). The identifiers are declared rather than
# fished out of the responses: we do not read bodies. The users and books with these
# names are created by `tokens.mjs` before the run.
resources:
  - id: user-alice
    tenant: vampi
    owner: alice
    params: { username: alice }
  - id: user-bob
    tenant: vampi
    owner: bob
    params: { username: bob }

  # A book holds a "secret", and by VAmPI's own design only the owner sees it.
  - id: book-alice
    tenant: vampi
    owner: alice
    params: { book_title: alice-secret-book }
  - id: book-bob
    tenant: vampi
    owner: bob
    params: { book_title: bob-secret-book }

# `GET /createdb` recreates the database from scratch. The method is safe, the
# semantics are not, and `SAFE_METHODS` does not protect against that: the protection
# looks at the method, not at the meaning. A request to it in the middle of a run
# wipes alice and bob together with their books, after which the rest of the matrix is
# probed against an empty database. This endpoint really was called by the tool on the
# first run against VAmPI — the `exclude` list appeared because of it.
exclude: [db.createdb]

policy:
  # Everything that is not declared is forbidden.
  fallback: denied
  rules:
    # The banner is public by design.
    - roles: "*"
      endpoints: [home]
      outcome: allowed

    # Who you are — you may ask about yourself, and only when authenticated.
    - roles: [user]
      endpoints: [me]
      outcome: allowed

    # The book list is meant for an authenticated user: by VAmPI's design it is his
    # own shelf. Not for the anonymous account, which is why the rule is not about `*`.
    - roles: [user]
      endpoints: [books.list]
      outcome: allowed

    # One's own profile — allowed. Another user's (same-tenant) and a request with no
    # token (foreign-tenant for the anonymous account) stay under fallback: denied.
    # Another user's email is not something handed out by identifier.
    - roles: [user]
      endpoints: [users.read]
      scope: own
      outcome: allowed

    # The secret of one's own book — allowed. Another user's — not: this is the direct
    # wording from VAmPI's README, "only the owner of the book should be allowed to
    # view the secret".
    - roles: [user]
      endpoints: [books.read]
      scope: own
      outcome: allowed

    # users.list and users.debug are declared nowhere and are therefore forbidden to
    # everyone. A list of users with their email addresses is not public data, and a
    # debug endpoint with passwords must not be available to anybody at all.
