# Конфигурация прогона против VAmPI (формат — ADR-0008).
#
# Токенов здесь нет: аккаунт называет имя переменной окружения. Значения
# выставляет `tokens.mjs` (регистрирует пользователей со случайными паролями
# и логинится за них) либо оператор вручную — см. README.md.
#
# Политика — объявление человека о том, как обязан вести себя корректный API,
# а не пересказ поведения VAmPI (ADR-0006). Отсюда и находки: где объявленное
# расходится с наблюдаемым, там дефект.

target:
  # Порт обязан совпадать с VAMPI_PORT в docker-compose.yaml. `verify.mjs`
  # берёт порт отсюда и передаёт его compose — разойтись им негде.
  baseUrl: http://127.0.0.1:5002
  allowedHosts: [127.0.0.1]
  # Без метки отчёт не называет проверенную систему. Здесь она говорит и то,
  # что это учебное приложение, и в каком режиме оно поднято: у VAmPI дефекты
  # переключаются переменной окружения, и «чисто» без режима не читается.
  label: VAmPI (учебное приложение с переключаемыми уязвимостями)

# Перечень обязателен не для красоты: опечатка в имени тенанта уводит объект
# в foreign-tenant, правило со scope перестаёт применяться, и настоящая
# находка проваливается в fallback: denied — то есть исчезает.
tenants: [vampi, none]

accounts:
  # VAmPI одноарендна: тенант один на всех, и межтенантную утечку здесь
  # не смоделировать. Проверяется другая половина — BOLA внутри тенанта,
  # для чего и нужны двое равноправных пользователей.
  - id: alice
    role: user
    tenant: vampi
    tokenEnv: VAMPI_TOKEN_ALICE
    # `/me` — единственная ручка, где VAmPI сам требует токен. Остальные
    # ответили бы 200 и с неработающим токеном, то есть канарейкой быть не могут.
    canary: me
  - id: bob
    role: user
    tenant: vampi
    tokenEnv: VAMPI_TOKEN_BOB
    canary: me

  # Аноним: без токена. Половина находок здесь — «эта ручка не должна быть
  # публичной», и без такого аккаунта они недостижимы.
  # Тенант `none` — служебный: любой объект для анонима foreign-tenant.
  - id: anonymous
    role: anonymous
    tenant: none

# Роль admin не заводится намеренно. В VAmPI она даёт ровно одно право —
# `DELETE /users/v1/{username}`, то есть небезопасный метод, куда инструмент
# не ходит. Аккаунт-администратор дал бы столбец матрицы, тождественный
# пользовательскому, и создал бы видимость покрытия роли.

# Объекты обращения (ADR-0010). Идентификаторы объявлены, а не выужены
# из ответов: тела мы не читаем. Пользователей и книги с этими именами
# создаёт `tokens.mjs` перед прогоном.
resources:
  - id: user-alice
    tenant: vampi
    owner: alice
    params: { username: alice }
  - id: user-bob
    tenant: vampi
    owner: bob
    params: { username: bob }

  # Книга хранит «секрет», и по замыслу самого VAmPI его видит только владелец.
  - id: book-alice
    tenant: vampi
    owner: alice
    params: { book_title: alice-secret-book }
  - id: book-bob
    tenant: vampi
    owner: bob
    params: { book_title: bob-secret-book }

# `GET /createdb` пересоздаёт базу с нуля. Метод безопасный, семантика — нет,
# и `SAFE_METHODS` от этого не защищает: защита смотрит на метод, а не на смысл.
# Обращение к нему посреди прогона стирает alice и bob вместе с их книгами,
# после чего оставшаяся часть матрицы опрашивается против пустой базы.
# Этот эндпоинт реально вызывался инструментом на первом прогоне против VAmPI —
# из-за него список `exclude` и появился.
exclude: [db.createdb]

policy:
  # Всё, что не объявлено, запрещено.
  fallback: denied
  rules:
    # Баннер публичен по назначению.
    - roles: "*"
      endpoints: [home]
      outcome: allowed

    # Кто ты — можно спрашивать про себя и только аутентифицированным.
    - roles: [user]
      endpoints: [me]
      outcome: allowed

    # Список книг положен аутентифицированному пользователю: по замыслу VAmPI
    # это его полка. Анониму — нет, поэтому правило не про `*`.
    - roles: [user]
      endpoints: [books.list]
      outcome: allowed

    # Свой профиль — можно. Чужой (same-tenant) и обращение без токена
    # (foreign-tenant у анонима) остаются под fallback: denied. Email чужого
    # пользователя не то, что раздают по идентификатору.
    - roles: [user]
      endpoints: [users.read]
      scope: own
      outcome: allowed

    # Секрет своей книги — можно. Чужой — нет: это прямая формулировка
    # из README VAmPI, «only the owner of the book should be allowed to view
    # the secret».
    - roles: [user]
      endpoints: [books.read]
      scope: own
      outcome: allowed

    # users.list и users.debug не объявлены нигде и потому запрещены всем.
    # Перечень пользователей с адресами почты — не публичные данные, а отладочная
    # ручка с паролями не должна быть доступна вообще никому.
