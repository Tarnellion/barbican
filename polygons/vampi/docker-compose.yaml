# VAmPI как полигон: один экземпляр, режим задаётся переменной.
#
# Один сервис, а не два (как в docker-compose самого VAmPI), потому что
# конфигурация прогона называет ровно один `baseUrl`. Два экземпляра на разных
# портах означали бы две конфигурации, которые разойдутся при первой же правке
# политики, — а сравнивать режимы имеет смысл только одной и той же политикой.

services:
  vampi:
    image: erev0s/vampi:latest
    container_name: barbican-vampi
    ports:
      # Только петля. Полигон намеренно уязвим: пароли всех пользователей
      # отдаёт кто угодно без токена, а `GET /createdb` сбрасывает базу.
      # `5002:5000` без адреса выставил бы это в локальную сеть.
      - "127.0.0.1:${VAMPI_PORT:-5002}:5000"
    environment:
      # 1 — дефекты включены, 0 — «защищённый» режим. По статусу ответа режимы
      # различаются ровно в одном месте (см. ground-truth.json, defect
      # `bola-book-secret`), поэтому оба режима — не «есть находки / нет находок»,
      # а два разных списка находок.
      - vulnerable=${VAMPI_VULNERABLE:-1}
      # Время жизни токена. Дефолт VAmPI — 60 секунд: токен истекает посреди
      # прогона, ответы становятся 401, отказ совпадает с политикой там, где
      # доступ не положен, и отчёт выглядит чистым. Канарейка ловит это не всегда:
      # она проверяется до прогона, когда токен ещё жив.
      - tokentimetolive=${VAMPI_TOKEN_TTL:-3600}
