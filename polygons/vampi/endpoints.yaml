# The hand-written list of VAmPI's endpoints.
#
# Written from the table of actions in VAmPI's own README and checked against its
# openapi3.yml. This is not a dump of the specification: VAmPI serves a specification
# at `/openapi.json`, and parsing it would be more convenient — but the list has to be
# complete, including what the tool will never reach. The line "a PUT that changes
# anybody's password" in the report as a skip is more honest than its absence.
endpoints:
  # The banner. It answers everyone and always — a control that the deployment is
  # alive at all.
  - id: home
    method: GET
    path: /

  # Resets and recreates the database. A GET, that is, `SAFE_METHODS` will not stop
  # it. Excluded by name in barbican.run.yaml — see there for why.
  - id: db.createdb
    method: GET
    path: /createdb

  - id: users.list
    method: GET
    path: /users/v1

  # A debug endpoint: the passwords and the admin flag of all users.
  - id: users.debug
    method: GET
    path: /users/v1/_debug

  - id: users.register
    method: POST
    path: /users/v1/register

  - id: users.login
    method: POST
    path: /users/v1/login

  # The only VAmPI endpoint where authorization is checked by connexion itself:
  # without a token, 401. The canary for the authenticated accounts.
  - id: me
    method: GET
    path: /me

  - id: users.read
    method: GET
    path: /users/v1/{username}

  - id: users.delete
    method: DELETE
    path: /users/v1/{username}

  - id: users.update-email
    method: PUT
    path: /users/v1/{username}/email

  - id: users.update-password
    method: PUT
    path: /users/v1/{username}/password

  - id: books.list
    method: GET
    path: /books/v1

  - id: books.add
    method: POST
    path: /books/v1

  # The book's secret. The only VAmPI defect distinguishable by status between the
  # modes lives here: in the vulnerable one another user's book is served 200, in the
  # secure one 404.
  - id: books.read
    method: GET
    path: /books/v1/{book_title}
